<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IThinkItsArt — Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; font-family: Georgia, serif; color: #fff; min-height: 100vh; overflow-x: hidden; }
    #splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem; background: #000; position: relative; z-index: 10; }
    #splash-logo { display: flex; flex-direction: column; align-items: center; gap: 0.1rem; }
    #splash-logo span { font-size: 2.4rem; font-weight: 300; letter-spacing: 0.5rem; color: #fff; line-height: 1.1; }
    .splash-btn { background: transparent; border: 1px solid rgba(255,255,255,0.45); color: #fff; font-family: Georgia, serif; font-size: 0.8rem; letter-spacing: 0.3rem; padding: 13px 40px; cursor: pointer; text-transform: uppercase; transition: background 0.3s, border-color 0.3s; display: block; text-align: center; width: 100%; }
    .splash-btn:hover { background: rgba(255,255,255,0.07); border-color: #fff; }
    #btn-group { display: flex; flex-direction: column; gap: 12px; width: 220px; }
    #splash-footer { position: absolute; bottom: 1.5rem; font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 0.25rem; }
    #live { display: none; position: fixed; inset: 0; background: #000; z-index: 5; }
    #live-img-a, #live-img-b { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity 1.5s ease-in-out; }
    #live-img-a { opacity: 1; } #live-img-b { opacity: 0; }
    #live-exit { position: absolute; top: 1.5rem; right: 1.5rem; z-index: 20; background: transparent; border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.6); font-family: Georgia, serif; font-size: 11px; letter-spacing: 0.15rem; padding: 7px 18px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
    #live-exit:hover { color: #fff; border-color: #fff; }
    #live-title { position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%); font-size: 13px; color: rgba(255,255,255,0.55); letter-spacing: 0.12rem; font-family: Georgia, serif; text-align: center; white-space: nowrap; transition: opacity 0.6s; }
    #dreamwalk { display: none; position: fixed; inset: 0; z-index: 5; overflow: hidden; cursor: pointer; }
    #dw-clouds { position: absolute; top: -8%; left: -8%; right: -8%; bottom: -8%; background: radial-gradient(ellipse at 30% 20%, #e8eef6 0%, #c5d3e4 40%, #9eb0c8 100%), url('clouds.png') center center / cover no-repeat; will-change: transform; }
    #dw-tint { position: absolute; inset: 0; mix-blend-mode: multiply; pointer-events: none; }
    #dw-exit { position: absolute; top: 1.5rem; right: 1.5rem; z-index: 20; background: transparent; border: 1px solid rgba(0,0,0,0.1); color: rgba(0,0,0,0.22); font-family: Georgia, serif; font-size: 11px; letter-spacing: 0.15rem; padding: 7px 18px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
    #dw-exit:hover { color: rgba(0,0,0,0.55); border-color: rgba(0,0,0,0.28); }
    #dw-pause-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30; pointer-events: none; font-family: Georgia, serif; font-size: 13px; letter-spacing: 0.3rem; color: rgba(0,0,0,0.3); text-transform: uppercase; opacity: 0; transition: opacity 0.4s ease; }
    #dw-left, #dw-right { position: absolute; top: 0; bottom: 0; overflow: hidden; z-index: 2; }
    #dw-left  { left: 8%;  width: 36%; }
    #dw-right { right: 8%; width: 36%; }
    .dw-piece { position: absolute; left: 50%; display: flex; flex-direction: column; align-items: center; gap: 10px; will-change: transform, opacity; }
    .dw-piece img { display: block; border-radius: 4px; box-shadow: 0 20px 70px rgba(0,0,0,0.18); cursor: pointer; }
    .dw-piece .dw-label { font-size: 10px; color: rgba(0,0,0,0.28); letter-spacing: 0.12rem; font-family: Georgia, serif; text-align: center; white-space: nowrap; pointer-events: none; }
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 500; align-items: center; justify-content: center; padding: 1rem; }
    #overlay.on { display: flex; }
    #lightbox { background: #111; border: 0.5px solid rgba(255,255,255,0.12); border-radius: 10px; max-width: 500px; width: 100%; max-height: 92vh; overflow-y: auto; }
    #lb-img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 10px 10px 0 0; background: #1a1a1a; }
    #lb-body { padding: 1.25rem; }
    #lb-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    #lb-name { font-size: 1.15rem; font-weight: 400; color: #fff; font-family: Georgia, serif; }
    #lb-sub { font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 0.1rem; margin-bottom: 1.25rem; }
    #lb-close { background: transparent; border: none; color: rgba(255,255,255,0.4); font-size: 20px; cursor: pointer; line-height: 1; padding: 0 0 0 8px; transition: color 0.2s; }
    #lb-close:hover { color: #fff; }
    #lb-nav { display: flex; gap: 8px; }
    #lb-nav.hidden { display: none; }
    #lb-nav button { flex: 1; padding: 10px; font-size: 12px; border-radius: 5px; border: 0.5px solid rgba(255,255,255,0.15); background: transparent; color: rgba(255,255,255,0.7); cursor: pointer; font-family: Georgia, serif; letter-spacing: 0.08rem; transition: all 0.2s; }
    #lb-nav button:hover { background: rgba(255,255,255,0.06); color: #fff; border-color: rgba(255,255,255,0.35); }
    #lb-counter { font-size: 10px; color: rgba(255,255,255,0.25); text-align: center; margin-top: 10px; letter-spacing: 0.1rem; }
    #gallery { display: none; background: #0a0a0a; min-height: 100vh; padding: 2rem 1.5rem 4rem; max-width: 1200px; margin: 0 auto; }
    #gal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 12px; border-bottom: 0.5px solid rgba(255,255,255,0.1); padding-bottom: 1.25rem; }
    #gal-title { font-size: 1rem; font-weight: 400; letter-spacing: 0.2rem; color: #fff; }
    #gal-meta { font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 0.1rem; margin-top: 4px; }
    #controls { display: flex; gap: 8px; align-items: center; }
    #back-btn { background: transparent; border: 0.5px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.5); font-family: Georgia, serif; font-size: 11px; letter-spacing: 0.1rem; padding: 5px 14px; cursor: pointer; border-radius: 3px; transition: all 0.2s; }
    #back-btn:hover { color: #fff; border-color: rgba(255,255,255,0.5); }
    .view-btn { background: transparent; border: 0.5px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.4); font-size: 11px; padding: 5px 14px; border-radius: 3px; cursor: pointer; letter-spacing: 0.05rem; transition: all 0.2s; }
    .view-btn.on { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.4); }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    #grid.list { grid-template-columns: 1fr; }
    .card { background: #111; border: 0.5px solid rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; cursor: pointer; transition: border-color 0.2s, transform 0.15s; }
    .card:hover { border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #1a1a1a; }
    .card .info { padding: 8px 10px 10px; }
    .card .cname { font-size: 12px; color: #ccc; font-family: Georgia, serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #grid.list .card { display: flex; align-items: center; gap: 14px; }
    #grid.list .card img { width: 64px; height: 64px; flex-shrink: 0; aspect-ratio: 1; }
    #grid.list .card .info { flex: 1; }
    #grid.list .card .cname { font-size: 13px; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: #000; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  </style>
</head>
<body>
<div id="splash">
  <div id="splash-logo"><span>I</span><span>T</span><span>I</span><span>A</span></div>
  <div id="btn-group">
    <button class="splash-btn" onclick="enterGallery()">Enter Gallery</button>
    <button class="splash-btn" onclick="startLive()">Live Gallery</button>
    <button class="splash-btn" onclick="startDreamWalk()">Dream Walk</button>
  </div>
  <div id="splash-footer">ITHINKITSART</div>
</div>

<div id="live">
  <img id="live-img-a" src="" alt="" />
  <img id="live-img-b" src="" alt="" />
  <button id="live-exit" onclick="stopLive()">✕ Exit</button>
  <div id="live-title"></div>
</div>

<div id="dreamwalk" onclick="dwHandleClick(event)">
  <div id="dw-clouds"></div>
  <div id="dw-tint"></div>
  <div id="dw-left"></div>
  <div id="dw-right"></div>
  <div id="dw-pause-hint"></div>
  <button id="dw-exit" onclick="stopDreamWalk()">✕ Exit</button>
</div>

<div id="overlay" onclick="maybeClose(event)">
  <div id="lightbox">
    <img id="lb-img" src="" alt="" />
    <div id="lb-body">
      <div id="lb-top"><div id="lb-name"></div><button id="lb-close" onclick="closeLB()">✕</button></div>
      <div id="lb-sub"></div>
      <div id="lb-nav">
        <button onclick="nav(-1)">← Prev</button>
        <button onclick="nav(1)">Next →</button>
      </div>
      <div id="lb-counter"></div>
    </div>
  </div>
</div>

<div id="gallery">
  <div id="gal-header">
    <div>
      <div id="gal-title">I T H I N K I T S A R T</div>
      <div id="gal-meta">Ethereum</div>
    </div>
    <div id="controls">
      <button id="back-btn" onclick="goBack()">← Back</button>
      <button class="view-btn on" onclick="setView('grid')">Grid</button>
      <button class="view-btn" onclick="setView('list')">List</button>
    </div>
  </div>
  <div id="grid"></div>
</div>

<script src="clouds-a.js"></script>
<script src="clouds-b.js"></script>
<script src="clouds-c.js"></script>
<script src="nfts.js"></script>
<script>
const CONTRACT = '0x0bec5e0483db9b09946c0b37d243d8d8393a6d12';

const audioCtx = typeof AudioContext !== 'undefined' ? new AudioContext() : null;
function playTone(freq, type, duration, vol) {
  if (!audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol || 0.04, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function soundHover()  { playTone(880, 'sine', 0.18, 0.03); }
function soundOpen()   { playTone(440, 'sine', 0.12, 0.04); setTimeout(() => playTone(660, 'sine', 0.18, 0.035), 80); }
function soundClose()  { playTone(550, 'sine', 0.1, 0.03); setTimeout(() => playTone(380, 'sine', 0.15, 0.025), 70); }
function soundNav()    { playTone(700, 'sine', 0.08, 0.025); }
function soundPause()  { playTone(200, 'sine', 0.2, 0.04); }
function soundResume() { playTone(320, 'sine', 0.15, 0.035); }
function haptic(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); }
function hapticTap()    { haptic(8); }
function hapticOpen()   { haptic([6, 30, 10]); }
function hapticClose()  { haptic(6); }
function hapticPause()  { haptic([10, 20, 10]); }

let current = 0, lbContext = 'gallery';
function openLB(i, context) {
  current = i; lbContext = context || 'gallery';
  const n = NFTS[i];
  document.getElementById('lb-img').src = n.img;
  document.getElementById('lb-img').alt = n.name;
  document.getElementById('lb-name').textContent = n.name;
  document.getElementById('lb-sub').textContent = 'IThinkItsArt · Ethereum';
  document.getElementById('lb-counter').textContent = `${i + 1} of ${NFTS.length}`;
  document.getElementById('lb-nav').classList.toggle('hidden', lbContext === 'dreamwalk');
  document.getElementById('overlay').classList.add('on');
  soundOpen(); hapticOpen();
}
function closeLB() {
  document.getElementById('overlay').classList.remove('on');
  soundClose(); hapticClose();
  if (lbContext === 'dreamwalk' && dwPaused) {
    dwPaused = false;
    const pausedFor = performance.now() - dwPauseStart;
    dwPauseOffset += pausedFor;
    dwLanes.forEach(p => { p.startTime += pausedFor; });
    dwLastL += pausedFor; dwLastR += pausedFor; dwCloudStart += pausedFor;
    dwCloudRAF = requestAnimationFrame(dwAnimateClouds);
    dwBgRAF    = requestAnimationFrame(dwAnimateTint);
    dwRAF      = requestAnimationFrame(dwTick);
  }
}
function maybeClose(e) { if (e.target === document.getElementById('overlay')) closeLB(); }
function nav(d) { soundNav(); hapticTap(); openLB((current + d + NFTS.length) % NFTS.length, lbContext); }
document.addEventListener('keydown', e => {
  if (!document.getElementById('overlay').classList.contains('on')) return;
  if (e.key === 'ArrowRight' && lbContext === 'gallery') nav(1);
  if (e.key === 'ArrowLeft'  && lbContext === 'gallery') nav(-1);
  if (e.key === 'Escape') closeLB();
});

let liveIndex = 0, liveTimer = null, activeSlot = 'a';
function startLive() {
  hapticTap(); soundOpen();
  liveIndex = 0; activeSlot = 'a';
  document.getElementById('splash').style.display = 'none';
  document.getElementById('live').style.display = 'block';
  const imgA = document.getElementById('live-img-a'), imgB = document.getElementById('live-img-b');
  imgA.style.opacity = '1'; imgB.style.opacity = '0';
  imgA.src = NFTS[0].img;
  document.getElementById('live-title').textContent = NFTS[0].name;
  imgB.src = NFTS[1 % NFTS.length].img;
  liveTimer = setInterval(advanceLive, 3500);
}
function advanceLive() {
  liveIndex = (liveIndex + 1) % NFTS.length;
  const imgA = document.getElementById('live-img-a'), imgB = document.getElementById('live-img-b');
  const titleEl = document.getElementById('live-title');
  if (activeSlot === 'a') { imgB.src = NFTS[liveIndex].img; imgB.style.opacity='1'; imgA.style.opacity='0'; activeSlot='b'; }
  else { imgA.src = NFTS[liveIndex].img; imgA.style.opacity='1'; imgB.style.opacity='0'; activeSlot='a'; }
  titleEl.style.opacity = '0';
  setTimeout(() => { titleEl.textContent = NFTS[liveIndex].name; titleEl.style.opacity = '1'; }, 800);
  new Image().src = NFTS[(liveIndex + 1) % NFTS.length].img;
}
function stopLive() {
  hapticClose(); soundClose();
  clearInterval(liveTimer); liveTimer = null;
  document.getElementById('live').style.display = 'none';
  document.getElementById('splash').style.display = 'flex';
}

let dwRAF = null, dwBgRAF = null, dwCloudRAF = null, dwLanes = [];
let dwPoolL = [], dwPoolR = [], dwIdxL = 0, dwIdxR = 0;
let dwLastL = 0, dwLastR = 0;
let dwCur = {r:255,g:255,b:255}, dwTgt = {r:255,g:255,b:255};
let dwPaused = false, dwPauseOffset = 0, dwPauseStart = 0, dwCloudStart = 0;
let dwHintTimer = null;
const dwTint = document.getElementById('dw-tint');
const dwClouds = document.getElementById('dw-clouds');
if (window.ITIA_CLOUDS) {
  dwClouds.style.background = "radial-gradient(ellipse at 30% 20%, #e8eef6 0%, #c5d3e4 40%, #9eb0c8 100%), url('"+ITIA_CLOUDS+"') center center / cover no-repeat";
}

const dwHint = document.getElementById('dw-pause-hint');

function dwShowHint(text) {
  dwHint.textContent = text; dwHint.style.opacity = '1';
  clearTimeout(dwHintTimer);
  dwHintTimer = setTimeout(() => { dwHint.style.opacity = '0'; }, 1400);
}
function dwHandleClick(e) {
  if (e.target.id === 'dw-exit') return;
  if (e.target.tagName === 'IMG' && e.target.closest('.dw-piece')) {
    const nftId = e.target.dataset.nftId;
    const idx = NFTS.findIndex(n => String(n.id) === nftId);
    if (idx !== -1) {
      if (!dwPaused) { dwPaused = true; dwPauseStart = performance.now(); cancelAnimationFrame(dwRAF); cancelAnimationFrame(dwBgRAF); cancelAnimationFrame(dwCloudRAF); dwRAF = null; dwBgRAF = null; dwCloudRAF = null; }
      openLB(idx, 'dreamwalk');
    }
    return;
  }
  dwTogglePause();
}
function dwTogglePause() {
  dwPaused = !dwPaused;
  if (dwPaused) {
    dwPauseStart = performance.now();
    cancelAnimationFrame(dwRAF); cancelAnimationFrame(dwBgRAF); cancelAnimationFrame(dwCloudRAF);
    dwRAF = null; dwBgRAF = null; dwCloudRAF = null;
    soundPause(); hapticPause();
    dwShowHint('paused');
  } else {
    const pausedFor = performance.now() - dwPauseStart;
    dwPauseOffset += pausedFor;
    dwLanes.forEach(p => { p.startTime += pausedFor; });
    dwLastL += pausedFor; dwLastR += pausedFor; dwCloudStart += pausedFor;
    dwCloudRAF = requestAnimationFrame(dwAnimateClouds);
    dwBgRAF    = requestAnimationFrame(dwAnimateTint);
    dwRAF      = requestAnimationFrame(dwTick);
    soundResume(); hapticTap();
    dwShowHint('');
  }
}
function dwAnimateClouds(now) {
  const t = (now - dwCloudStart) / 1000;
  const dx = Math.sin(t / 28) * 6, dy = Math.cos(t / 22) * 4;
  const breathe = 1.0 + Math.sin(t / 18) * 0.025;
  dwClouds.style.transform = `translate(${dx}px, ${dy}px) scale(${breathe})`;
  dwCloudRAF = requestAnimationFrame(dwAnimateClouds);
}
function dwAnimateTint(now) {
  const spd = 0.005;
  dwCur.r += (dwTgt.r - dwCur.r) * spd;
  dwCur.g += (dwTgt.g - dwCur.g) * spd;
  dwCur.b += (dwTgt.b - dwCur.b) * spd;
  dwTint.style.background = `rgba(${Math.round(dwCur.r)},${Math.round(dwCur.g)},${Math.round(dwCur.b)},0.38)`;
  dwBgRAF = requestAnimationFrame(dwAnimateTint);
}
function startDreamWalk() {
  hapticOpen(); soundOpen();
  document.getElementById('splash').style.display = 'none';
  document.getElementById('dreamwalk').style.display = 'block';
  dwPoolL = [...NFTS].sort(() => Math.random() - 0.5);
  dwPoolR = [...NFTS].sort(() => Math.random() - 0.5);
  dwIdxL = 0; dwIdxR = 0; dwLanes = [];
  dwPaused = false; dwPauseOffset = 0;
  dwCur = {r:255,g:255,b:255}; dwTgt = {r:255,g:255,b:255};
  dwTint.style.background = 'rgba(255,255,255,0.38)';
  const now = performance.now();
  dwCloudStart = now; dwLastL = now - 3400; dwLastR = now - 1700;
  dwCloudRAF = requestAnimationFrame(dwAnimateClouds);
  dwBgRAF    = requestAnimationFrame(dwAnimateTint);
  dwRAF      = requestAnimationFrame(dwTick);
}
function dwBaseSize() {
  const w = window.innerWidth;
  if (w >= 1200) return 320; if (w >= 900) return 270; if (w >= 600) return 220; return 180;
}
function dwSpawn(side, now) {
  const container = document.getElementById(side === 'L' ? 'dw-left' : 'dw-right');
  const pool = side === 'L' ? dwPoolL : dwPoolR;
  const nft = pool[(side === 'L' ? dwIdxL++ : dwIdxR++) % pool.length];
  const el = document.createElement('div'); el.className = 'dw-piece';
  const base = dwBaseSize();
  const img = document.createElement('img');
  img.src = nft.img; img.dataset.nftId = String(nft.id);
  img.style.cssText = `width:${base}px;height:${base}px;object-fit:cover;border-radius:4px;box-shadow:0 20px 70px rgba(0,0,0,0.18);cursor:pointer;`;
  const label = document.createElement('div'); label.className = 'dw-label'; label.textContent = nft.name;
  el.appendChild(img); el.appendChild(label);
  el.style.cssText = 'position:absolute;left:50%;display:flex;flex-direction:column;align-items:center;gap:10px;will-change:transform,opacity;opacity:0;';
  container.appendChild(el);
  const duration = 13000 + Math.random() * 3000;
  dwLanes.push({ el, startTime: now, duration, base, bg: nft.bg });
}
function dwEase(t) { const b = Math.sin(t * Math.PI); return b * b; }
function dwTick(now) {
  const INTERVAL = 4200;
  if (now - dwLastL >= INTERVAL) { dwSpawn('L', now); dwLastL = now; }
  if (now - dwLastR >= INTERVAL) { dwSpawn('R', now); dwLastR = now; }
  const h = window.innerHeight; let maxBell = 0;
  dwLanes = dwLanes.filter(p => {
    const t = (now - p.startTime) / p.duration;
    if (t >= 1) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); return false; }
    const bell = dwEase(t);
    const scale = 0.12 + bell * 0.88;
    const opacity = Math.min(bell * 1.4, 0.92);
    const y = h * 1.15 - t * h * 2.3 + bell * h * 0.08;
    const size = p.base * scale;
    p.el.style.transform = `translateX(${-(size/2)}px) translateY(${y}px) scale(${scale})`;
    p.el.style.opacity = opacity;
    if (bell > maxBell) { maxBell = bell; dwTgt = { r: Math.round(p.bg[0]*0.75+255*0.25), g: Math.round(p.bg[1]*0.75+255*0.25), b: Math.round(p.bg[2]*0.75+255*0.25) }; }
    return true;
  });
  dwRAF = requestAnimationFrame(dwTick);
}
function stopDreamWalk() {
  hapticClose(); soundClose();
  if (dwRAF) cancelAnimationFrame(dwRAF); dwRAF = null;
  if (dwBgRAF) cancelAnimationFrame(dwBgRAF); dwBgRAF = null;
  if (dwCloudRAF) cancelAnimationFrame(dwCloudRAF); dwCloudRAF = null;
  clearTimeout(dwHintTimer);
  document.querySelectorAll('.dw-piece').forEach(el => el.remove());
  dwLanes = []; dwPaused = false;
  dwTint.style.background = 'rgba(255,255,255,0)';
  dwClouds.style.transform = 'translate(0,0) scale(1)';
  document.getElementById('dreamwalk').style.display = 'none';
  document.getElementById('splash').style.display = 'flex';
}
function enterGallery() {
  hapticTap(); soundOpen();
  document.getElementById('splash').style.display='none';
  document.getElementById('gallery').style.display='block';
  buildGrid();
}
function goBack() {
  hapticClose(); soundClose();
  document.getElementById('gallery').style.display='none';
  document.getElementById('splash').style.display='flex';
}
function buildGrid() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  NFTS.forEach((n,i) => {
    const d = document.createElement('div'); d.className='card';
    d.addEventListener('mouseenter', () => soundHover());
    d.addEventListener('touchstart', () => { soundHover(); hapticTap(); }, { passive: true });
    d.onclick = () => openLB(i, 'gallery');
    d.innerHTML=`<img src="${n.img}" alt="${n.name}" loading="lazy"/><div class="info"><div class="cname">${n.name}</div></div>`;
    g.appendChild(d);
  });
}
document.querySelectorAll('.splash-btn').forEach(btn => {
  btn.addEventListener('mouseenter', () => soundHover());
  btn.addEventListener('touchstart', () => { soundHover(); hapticTap(); }, { passive: true });
});
function setView(v) {
  document.getElementById('grid').className=v==='list'?'list':'';
  document.querySelectorAll('.view-btn').forEach((b,i)=>b.classList.toggle('on',(v==='grid'&&i===0)||(v==='list'&&i===1)));
}
</script>
</body>
</html>
